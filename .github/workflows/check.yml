name: Integration tests style

# Checks owned source style only. The runner's tests run with pekit on the
# build server and with `tools/check` locally, not here.
on:
    pull_request:
    push:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: integration-tests-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    style:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: "22.22.1"
            - name: Prepare pinned PSC style tools
              run: python3 tools/prepare-style-tools.py "$RUNNER_TEMP/integration-tests-style"
            - name: Check style
              env:
                  PEIOS_STYLE_BIN: ${{ runner.temp }}/integration-tests-style/bin
              run: python3 tools/style-check.py

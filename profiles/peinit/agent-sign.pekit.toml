# A sign-only recipe: PIP-sign the provium agent at the TCB tier, so the
# agent dominates the image's TCB-signed services (peinit, authd, eventd)
# the way any administrative tool on a real system would have to.
#
# build.sh copies the agent beside this file as sbin/provium-agent and runs
# `pekit build main` here with the development keyring; the signed binary
# lands in out/build/main/usr/bin/provium-agent. Without it the agent runs
# at pip_type 0, and PIP denies it every signal and every /proc read of a
# protected process (PKM §3.7) — kill, kill -STOP, /proc/<pid>/fd, fdinfo —
# which most of the eventd testset and parts of the peinit one depend on.

out_dir = "out"

[build.main]
command = 'mkdir -p "$PEKIT_OUT/usr/bin" && cp "$PEKIT_SOURCE_ROOT/sbin/provium-agent" "$PEKIT_OUT/usr/bin/provium-agent"'

[build.main.sign.pip]
"usr/bin/provium-agent" = "tcb.priv"

# The kernel conformance VM: a composed Peios root holding nothing but
# the kernel, booted by provium with its own agent as PID 1.
#
# Relative paths — and this command's working directory — are this
# profile's own directory, so the script beside this file is the one
# that runs, and the two specs it names are the repository's and this
# one's.
#
# It is a script rather than a `peiso root` one-liner because provium
# runs the build on every invocation and holds no staleness logic:
# composing unconditionally costs 45 seconds a run against 1 second of
# tests. build.sh composes only when a spec or a package has moved.
build = "./build.sh {out}"

# No `kernel`: provium finds it inside the composed root, so a kernel
# version bump moves nothing here.
root = "{out}/root"

# The initrd is not a userspace. This VM has none of its own — the agent
# overlay is concatenated onto this archive and the agent comes up as
# PID 1 and does init's mounts itself. There is nothing to boot into,
# which is the point: what the tests reach is the kernel and only the
# kernel. What the archive carries is /fixtures: the two kernel modules
# the tests load, signed and unsigned firmware blobs, an NTFS image —
# things a claim needs that a kernel alone cannot provide. build.sh
# describes each.
initrd = "{out}/extras.cpio.gz"

# panic=1 so a kernel that dies takes the VM down instead of hanging
# the run until it times out.
#
# stratafs.test_hooks=1 registers the stratafs test rendezvous/fail
# points (PKM §4.A.2) on securityfs. Test profiles only; production
# images never pass it.
cmdline = "console=hvc0 quiet panic=1 stratafs.test_hooks=1"
